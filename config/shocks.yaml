# Stress scenarios applied by Module B when a high-impact event is detected.
# Shock sizes are calibrated at module_b.reference_impact and scaled linearly by the event's
# Impact Score (capped at module_b.max_scale).
#   equity_pct        : % change in equity prices (applied with position beta)
#   rates_bp          : parallel shift in risk-free rates (basis points)
#   spread_bp         : credit spread widening by rating bucket (bp)
#   fx_pct            : % change of each currency vs USD (negative = currency weakens)
#   pd_multiplier     : multiplier on loan probabilities of default
#   lgd_add           : absolute add-on to loss-given-default (0.05 = +5 pts)
#   sector_amplifier  : extra multiplier for exposures in sectors named by the event
#   region_amplifier  : extra multiplier for exposures in regions named by the event
scenarios:
  Geopolitical:
    description: "Risk-off shock: equities sell off, spreads widen, EM currencies weaken, flight to quality in rates"
    equity_pct: -10.0
    rates_bp: -25
    spread_bp: {AAA: 15, AA: 25, A: 50, BBB: 100, BB: 250, B: 400, CCC: 700}
    fx_pct: {EUR: -2.0, GBP: -2.0, JPY: 3.0, INR: -4.0, BRL: -6.0, TRY: -10.0, CNY: -3.0, USD: 0.0}
    pd_multiplier: 1.3
    lgd_add: 0.03
    sector_amplifier: 1.5
    region_amplifier: 1.75
  Macroeconomic:
    description: "Rates shock: +200bp parallel shift, moderate equity drawdown, spreads widen"
    equity_pct: -5.0
    rates_bp: 200
    spread_bp: {AAA: 10, AA: 15, A: 30, BBB: 60, BB: 150, B: 250, CCC: 400}
    fx_pct: {EUR: -1.5, GBP: -1.5, JPY: -2.0, INR: -2.5, BRL: -4.0, TRY: -6.0, CNY: -1.5, USD: 0.0}
    pd_multiplier: 1.2
    lgd_add: 0.02
    sector_amplifier: 1.25
    region_amplifier: 1.25
  Credit Event:
    description: "Credit contagion: sharp spread widening, PDs double in affected sector, LGDs rise"
    equity_pct: -7.0
    rates_bp: -15
    spread_bp: {AAA: 20, AA: 35, A: 75, BBB: 175, BB: 400, B: 650, CCC: 1000}
    fx_pct: {EUR: -1.0, GBP: -1.0, JPY: 1.5, INR: -2.0, BRL: -3.0, TRY: -5.0, CNY: -1.0, USD: 0.0}
    pd_multiplier: 2.0
    lgd_add: 0.10
    sector_amplifier: 2.0
    region_amplifier: 1.5
  Regulatory/Legal:
    description: "Regulatory shock: sector-specific equity and spread repricing"
    equity_pct: -3.0
    rates_bp: 0
    spread_bp: {AAA: 5, AA: 10, A: 20, BBB: 40, BB: 80, B: 120, CCC: 200}
    fx_pct: {}
    pd_multiplier: 1.1
    lgd_add: 0.01
    sector_amplifier: 2.5
    region_amplifier: 1.0
  Merger/Acquisition:
    description: "Leverage event: acquirer spreads widen on debt-funded deal"
    equity_pct: -1.5
    rates_bp: 0
    spread_bp: {AAA: 5, AA: 10, A: 20, BBB: 35, BB: 60, B: 90, CCC: 150}
    fx_pct: {}
    pd_multiplier: 1.05
    lgd_add: 0.0
    sector_amplifier: 3.0
    region_amplifier: 1.0
# Basel-style standardized risk weights used for an indicative CET1 ratio.
risk_weights: {AAA: 0.20, AA: 0.20, A: 0.50, BBB: 1.00, BB: 1.00, B: 1.50, CCC: 1.50, NR: 1.00}
